<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AI Patent Intelligence System</title>

    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="container">

        <!-- HERO SECTION -->
        <div class="hero">

            <h1>AI Patent Intelligence System</h1>

            <p>
                Upload patent PDFs, search similar innovations,
                analyze overlapping concepts, and detect
                prior-art risks using AI-powered semantic search.
            </p>

        </div>


        <!-- MAIN GRID -->
        <div class="grid">

            <!-- UPLOAD CARD -->
            <div class="card">

                <h2>Upload Patent PDF</h2>

                <input
                    type="file"
                    id="pdfFile"
                    accept=".pdf"
                />

                <button onclick="uploadPatent()">
                    Upload Patent
                </button>

                <p id="uploadStatus"></p>

            </div>


            <!-- SEARCH CARD -->
            <div class="card">

                <h2>Search Similar Patents</h2>

                <input
                    type="text"
                    id="query"
                    placeholder="Enter patent idea or innovation..."
                />

                <button onclick="searchPatents()">
                    Search Patents
                </button>

            </div>

        </div>


        <!-- RESULTS SECTION -->
        <div id="results"></div>


        <!-- FOOTER -->
        <div class="footer">

            <p>
                Built using FastAPI, FAISS, LangChain,
                Gemini AI, HTML, CSS & JavaScript
            </p>

        </div>

    </div>

    <!-- External JavaScript File -->
    <script src="script.js"></script>

</body>

</html>
